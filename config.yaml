llm:
  # provider: anthropic | openai
  provider: anthropic
  model: claude-sonnet-4-6
  temperature: 0.0

embeddings:
  # provider: openai | huggingface
  provider: openai
  model: text-embedding-3-small

chromadb:
  host: localhost
  port: 8000
  collection_name: finance_docs

scraper:
  user_agent: "Mozilla/5.0"
  request_timeout: 10
  sources: []

app:
  title: "AI Finance Assistant"
  host: localhost
  port: 8501
  debug: false

paths:
  rag_caches_dir: "rag_caches"
  html_cache_dir: "rag_caches/html_cache"
  scraper_cache_dir: "rag_caches/scraper_cache"
  chunk_cache_dir: "rag_caches/chunk_cache"
  qdrant_storage_dir: "rag_caches/qdrant_storage"

chunking:
  default_chunk_size: 500
  default_chunk_overlap: 50
  default_strategy: "recursive"

embedding:
  default_model: "bge-small-en-v1.5"
  default_collection_prefix: "fin"
  qdrant_distance: "cosine"
  # source_domain is retained here only to prevent a KeyError in src/workflow/graph.py,
  # which reads this key and passes it as the first argument to make_collection_name().
  # That argument is now IGNORED — domain is no longer part of the collection name.
  # New collection name format: fin_c{chunk_size}_o{overlap}_{dense}_{sparse}
  # Example with default settings:  fin_c500_o50_bge-small_bm42
  # TODO: remove source_domain once graph.py is updated to not pass it to make_collection_name()
  source_domain: "investor.gov"
