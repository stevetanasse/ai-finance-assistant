llm:
  # provider: anthropic | openai
  provider: anthropic
  model: claude-sonnet-4-6
  temperature: 0.0

embeddings:
  # provider: openai | huggingface
  provider: openai
  model: text-embedding-3-small

chromadb:
  host: localhost
  port: 8000
  collection_name: finance_docs

scraper:
  user_agent: "Mozilla/5.0"
  request_timeout: 10
  sources: []

app:
  title: "AI Finance Assistant"
  host: localhost
  port: 8501
  debug: false

paths:
  rag_caches_dir: "rag_caches"
  html_cache_dir: "rag_caches/html_cache"
  scraper_cache_dir: "rag_caches/scraper_cache"
  chunk_cache_dir: "rag_caches/chunk_cache"
  qdrant_storage_dir: "rag_caches/qdrant_storage"

chunking:
  default_chunk_size: 500
  default_chunk_overlap: 50
  default_strategy: "recursive"

embedding:
  default_model: "bge-small-en-v1.5"
  default_collection_prefix: "fin"
  qdrant_distance: "cosine"
  # NOTE: source_domain is read by src/workflow/graph.py to construct the Qdrant
  # collection name via EmbeddingCacheManager.make_collection_name(). Do not remove
  # without updating graph.py. It is NOT used for cache folder naming (domain
  # subfolders were removed in the GUID-based flat cache refactor).
  source_domain: "investor.gov"
